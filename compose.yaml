# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
    ports:
      - 8000:80
    volumes:
      - ./PregledLicnihFinansija:/var/www/html/PregledLicnihFinansija
    # Overrides .env, so the container always uses the local database.
    environment:
      - DB_CONNECTION=pgsql
      - DB_URL=
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=licne_finansije
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_SSLMODE=disable
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_DB=licne_finansije
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Creates the test database when the volume is first initialized.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "licne_finansije"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
